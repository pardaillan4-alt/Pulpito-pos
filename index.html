function cmp(){const t0=new Date().setHours(0,0,0,0),P=S.pag.filter(p=>p.at>=t0&&!p.anul&&p.met=="Efectivo"),Q=S.pag.filter(p=>p.at>=t0&&!p.anul&&p.met!="Efectivo"),M=S.movs.filter(m=>m.at>=t0),cerr=S.cortes.find(c=>c.at>=t0),prev=S.cortes.filter(c=>c.at<t0).sort((a,b)=>b.at-a.at)[0],auto=prev?prev.co||0:0,sm=f=>P.reduce((a,p)=>a+f(p),0),mv=t=>M.filter(m=>m.tipo==t).reduce((a,m)=>a+m.m,0),ef=sm(p=>p.tot),ga=mv("gasto"),no=mv("nomina"),ie=mv("ingreso"),fo=S.cj.f!==""?+S.cj.f:auto,ex=+S.cj.x||0,co=DEN.reduce((a,d)=>a+d*(+S.cj.d[d]||0),0)+ex,tpt=Q.reduce((a,p)=>a+(p.pp||0),0),esp=fo+ef+ie-ga-no-tpt;return{tpt,ex,cerr,auto,M,ef,tj:Q.reduce((a,p)=>a+p.tot,0),pp:sm(p=>p.pp||0),ds:sm(p=>p.ds||0),ga,no,ie,fo,esp,hay:co>0,co,dif:co-esp,n:P.length}}
