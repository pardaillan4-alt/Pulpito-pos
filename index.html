ción base, ajústala.)"},"※ Porción de clamato":{"ing":"• clamato","pro":"Porción de clamato por vaso para la michelada o cerveza con clamato. (Porción base, ajústala.)"},"※ Tanda de flan":{"ing":"• 4 huevos\n• 1 taza de lechera\n• 1/2 taza de nutrileche\n• 1/2 taza de clavel\n• 2 tapitas de vainilla\n• azúcar para el caramelo (caramelo para flan)\n\nRinde 6 piezas de flan de postre.","pro":"Se colocan los ingredientes en la licuadora; aparte, en la flanera se derrite el azúcar con caramelo para flan y se deja que endurezca el caramelo; después se vierte lo licuado y se coloca en la olla exprés a baño maría. Cuando empieza a sonar la olla se deja en la lumbre por media hora a flama media; después se deja enfriar y por último se guarda en el refrigerador. Rinde 6 piezas."},"※ Porción carne chile en nogada":{"ing":"• 1 porción de carne molida\n• 3 dedos de cebolla picada\n• fruta seca (3 dedos)\n• 1 cucharada chica de nuez picada\n• agua bendita y combinado","pro":"Se descongela la carne en el microondas y se saltea en el sartén con aceite, la cebolla, agua bendita y combinado; se agrega la semilla (nuez) y la fruta seca. Con esto se rellena el chile. (Porciones base, ajústalas.)"},"※ Salsa nogada":{"ing":"• 1 cacahuatero de nuez y almendra\n• 1/2 cacahuatero de crema\n• 1/2 cacahuatero de lechera","pro":"La salsa de nogada se prepara con la lechera, la crema y el cacahuatero de nuez y almendra en la licuadora; debe quedar espesa para servirse. Se sirve sobre el chile en cama de arroz y se adorna con granada o con jitomate y cilantro. (Porciones base por chile, ajústalas.)"},"※ Salsa enamorado":{"ing":"• 150 g de crema\n• 100 g de mayonesa\n• 30 g de chipotle\n• Un chorro de sazonador combinado\n• Un chorro de agua bendita","pro":"Pulpo enamorado: se saltea el pulpo con los sazonadores (combinado y agua bendita) y se baña con la salsa de crema, mayonesa y chipotle; se sirve con arroz. (Receta base de la salsa, ajústala a tu gusto.)"},"※ Salsa en su tinta":{"ing":"• Tinta de pulpo (ver preparación)","pro":"Se sirve el pulpo en su tinta: se calienta la tinta de pulpo preparada y se baña el pulpo."},"※ Salsa crema chipotle":{"ing":"• 200 g de crema\n• 50 g de chipotle\n• 50 g de mayonesa\n• 10 g de ajo","pro":"(Receta base, ajústala a tu gusto.) Se licua todo hasta que quede uniforme y se guarda en refrigeración."},"※ Salsa cucaracha":{"ing":"• Salsa huichol\n• Jugo de limón","pro":"Camarones cucaracha: lo de siempre pero con salsa huichol. (Receta base, ajústala a tu gusto.)"},"※ Porción coco":{"ing":"• 50 g de coco rallado\n• 20 g de harina\n• 1/2 huevo","pro":"(Porción base por orden de camarones al coco, ajústala a tu gusto.) El camarón se pasa por harina, huevo y coco rallado y se fríe."},"※ Porción ranchero":{"ing":"• 100 g de pico de gallo\n• cebolla fileteada\n• chile cuaresmeño en rodajas\n• 1 mano de aguacate","pro":"Camarones rancheros: en el sartén se pone aceite y la cebolla, se saltea el camarón con combinado y agua bendita, se agrega el chile y el pico de gallo, y se sirve con la mano de aguacate y el arroz. (Porciones base, ajústalas.)"},"※ Salsa mantequilla":{"ing":"• 500 g de mantequilla\n• 50 g de ajo picado\n• Jugo de 5 limones\n• Sal","pro":"(Receta base, ajústala a tu gusto.) Se derrite la mantequilla a fuego bajo, se dora el ajo sin que se queme, se agrega el jugo de limón y la sal. Se prepara por tanda y se guarda en refrigeración; se calienta al momento de servir."},"※ Salsa ajillo":{"ing":"• 200 g de ajo picado\n• 50 g de guajillo\n• 250 ml de aceite de oliva\n• Sal","pro":"(Receta base, ajústala a tu gusto.) Se desvena el guajillo y se corta en aros, se fríe el ajo en el aceite hasta que dore, se agrega el guajillo unos segundos y la sal. Se guarda en refrigeración."},"※ Salsa enchilada":{"ing":"• 100 g de guajillo\n• 20 g de chile de árbol\n• 30 g de ajo\n• 150 g de cebolla\n• 50 ml de aceite\n• Sal","pro":"(Receta base, ajústala a tu gusto.) Se tatema el chile con la cebolla y el ajo, se licua con agua y se cuela; se fríe en el aceite con la sal y se deja hervir hasta que espese."},"Pescadito":{"ing":"• 1 pescadito.\n• harina preparada","pro":"La tira de pescado se unta con harina preparada y se coloca en el aceite se cuida y se saca cuando este listo para servirse."},"Orden de dos pescaditos":{"ing":"• 1 pescadito.\n• harina preparada","pro":"La tira de pescado se unta con harina preparada y se coloca en el aceite se cuida y se saca cuando este listo para servirse."},"Orden de tres pescaditos":{"ing":"• 1 pescadito.\n• harina preparada","pro":"La tira de pescado se unta con harina preparada y se coloca en el aceite se cuida y se saca cuando este listo para servirse."},"Quesadilla":{"ing":"▸ Quesadilla de camarón\n• 3 camarones\n• pico de gallo preparado\n\n▸ Quesadilla de pez\n• Raspa de pescado preparada\n• pico de gallo preparado\n\n▸ Quesadilla de pulpo\n• 3 dedos de pulpo\n• pico de gallo preparado\n\n▸ Quesadilla especial\n• 4 camarones\n• queso Oaxaca\n• rajas de chile cuarismeño.\n• epazote\n• cebolla\n\n▸ Quesadilla de marlin\n• 2 cucharadas soperas de marlin preparado.\n• pico de gallo preparado.\n\n▸ Quesadilla de jaiba\n• 2 cucharadas soperas de pulpa de jaiba\n• pico de gallo preparado","pro":"▸ Quesadilla de camarón\nSe coloca en la tortilla los camarones revueltos con el pico de gallo, se le ponen palillos y se coloca en el aceite, cuando este listo se saca y se le pone mayonesa y aguacate y se sirve\n\n▸ Quesadilla de pez\nSe coloca en la tortilla la raspa de pescado, se le ponen palillos y se coloca en el aceite, cuando este listo se saca y se le pone mayonesa, pico de gallo y aguacate y se sirve\n\n▸ Quesadilla de pulpo\nSe coloca en la tortilla el pulpo con el pico de gallo, se le ponen palillos y se comoca en el aceite, cuando este listo se saca y se le pone mayonesa y aguacate y se sirve.\n\n▸ Quesadilla especial\nSe coloca en la tortilla los camarones con el queso Oaxaca, las rajas de chile cuarismeño, la cebolla, el epazote, se le ponen palillos y se coloca en el aceite, cuando este listo se saca y se le pone mayonesa y aguacate y se sirve.\n\n▸ Quesadilla de marlin\nSe coloca en la tortilla el marlin preparado, se le ponen palillos y se coloca en el aceite, cuando este listo se saca y se le pone el pico de gallo, la mayonesa y aguacate y se sirve.\n\n▸ Quesadilla de jaiba\nSe coloca en la tortilla la pulpa de jaiba, se le ponen palillos y se coloca en el aceite, cuando este listo se saca y se le pone el pico de gallo, la mayonesa y aguacate y se sirve."},"Tostada":{"ing":"• 1 tostada\n• porcion de mariscos ( en caso se camaron son 7 pz)\n• pico de gallo, mayonesa, lechuga y aguacate.","pro":"Se coloca mayonesa en la tostada, se pone pico de gallo y después el marisco correspondiente, se pone lechuga, aguacate y se sirve."},"Empanada":{"ing":"• 1 empanada\n• 3 pz de pacotilla\n• mayonesa, aguacate, cebolla y cilantro.","pro":"Se coloca la empanada en aceite para que se caliente, cuando esta lista se abre y se le pone la pacotilla extra, después mayonesa, verdura y aguacate, después se sirve."},"Orden de":{"ing":"▸ Orden de papas\n• Papas precocidas\n\n▸ Ensalada verde\n• cama de lechuga\n• pepino\n• jitomate\n• jícama\n• naranja\n• piña ( 3 rodajas)\n• 1 mano de aguacate\n• nuez pocada.","pro":"▸ Orden de papas\nPreviamente se coce la papa en aceite para cuándo pidan una orden no se tarde mucho en cocer.\n\n▸ Ensalada verde\n—"},"Cóctel de camarón":{"ing":"• Camarón o el marisco que pida el cliente de acuerdo con el tamaño pedido.\n• Capsu, cilantro, cebolla, aguacate, salsa bruja y aceite de olivo.","pro":"En la copa correspondiente se coloca el marisco, se pone un poco de olivo y salsa bruja, después se pone también capsu y la verdura y se manda para servir."},"Cóctel campechano":{"ing":"• Camarón o el marisco que pida el cliente de acuerdo con el tamaño pedido.\n• Capsu, cilantro, cebolla, aguacate, salsa bruja y aceite de olivo.","pro":"En la copa correspondiente se coloca el marisco, se pone un poco de olivo y salsa bruja, después se pone también capsu y la verdura y se manda para servir."},"Cóctel de ceviche":{"ing":"▸ Cóctel\n• Camarón o el marisco que pida el cliente de acuerdo con el tamaño pedido.\n• Capsu, cilantro, cebolla, aguacate, salsa bruja y aceite de olivo.\n\n▸ Ceviche\n• 12 pz de pescado (tilapia)\n• 4 chiles cuaresmeños\n• 1 cebolla morada\n• 4 jitomates\n• 12 aceitunas\n• Jugo de limón (para cocer el pescado)\n• Combinado, agua bendita, bruja, aceite de oliva, sal (1 cuchara grande de las de caldo)\n• 1 naranja exprimida","pro":"▸ Cóctel\nEn la copa correspondiente se coloca el marisco, se pone un poco de olivo y salsa bruja, después se pone también capsu y la verdura y se manda para servir.\n\n▸ Ceviche\nSe pica el chile, la cebolla, el jitomate y la aceituna.\nSe cuece el pescado (12 pz) en jugo de limón por una hora.\nSe echa combinado, un chorro de agua bendita, un chorro de bruja, un chorro de aceite de oliva, una cuchara de las grandes para caldo de sal y una naranja exprimida."},"Cóctel de jaiba":{"ing":"• Camarón o el marisco que pida el cliente de acuerdo con el tamaño pedido.\n• Capsu, cilantro, cebolla, aguacate, salsa bruja y aceite de olivo.","pro":"En la copa correspondiente se coloca el marisco, se pone un poco de olivo y salsa bruja, después se pone también capsu y la verdura y se manda para servir."},"Cóctel de pulpo":{"ing":"• Camarón o el marisco que pida el cliente de acuerdo con el tamaño pedido.\n• Capsu, cilantro, cebolla, aguacate, salsa bruja y aceite de olivo.","pro":"En la copa correspondiente se coloca el marisco, se pone un poco de olivo y salsa bruja, después se pone también capsu y la verdura y se manda para servir."},"Vuelve a la vida":{"ing":"• ostión\n• caracol\n• calamar blanco\n• ceviche de pescado\n• pulpo\n• surimi\n• pacotilla.\n• pata de mula","pro":"En la copa de cristal se colocan los mariscos en el orden previo y después todo lo demas que llevan los cócteles."},"Caldo de camarón":{"ing":"▸ Caldo de camarón chico\n• 5 camarones para caldo\n• Caldo de camarón\n\n▸ Caldo de camarón grande\n• 7 camarones para caldo\n• Caldo de camarón","pro":"▸ Caldo de camarón chico\nSe calienta el caldo con el camarón y cuando este hirviendo se sirve en la cazuela de barro.\n\n▸ Caldo de camarón grande\nSe calienta el caldo con el camarón y cuando este hirviendo se sirve en la cazuela de barro."},"Caldo de pescado":{"ing":"▸ Caldo de pescado chico\n• 3 tiras de pescado\n• 3 almejas\n\n▸ Caldo de pescado grande\n• 4 tiras de pescado\n• 4 almejas","pro":"▸ Caldo de pescado chico\nSe calienta el caldo con el pescado y las almejas, cuando este hirviendo se sirve en la cazuela de barro.\n\n▸ Caldo de pescado grande\nSe calienta el caldo con el pescado y las almejas, cuando este hirviendo se sirve en la cazuela de barro."},"Caldo combinado":{"ing":"▸ Caldo combinado chico\n• 2 tiras de pescado\n• 3 camarones para caldo\n• 3 almejas\n• 1/2 jaiba\n\n▸ Caldo combinado grande\n• 3 tiras de pescado\n• 4 camarones para caldo\n• 4 almejas\n• 1 jaiba","pro":"▸ Caldo combinado chico\nSe calienta el caldo con el pescado, el camaron, la jaiba y las almejas, cuando este hirviendo se sirve en la cazuela de barro.\n\n▸ Caldo combinado grande\nSe calienta el caldo con el pescado, el camaron, la jaiba y las almejas, cuando este hirviendo se sirve en la cazuela de barro."},"Consomé":{"ing":"▸ Consomé de almeja\n• 4 almejas\n• Caldo de camarón\n\n▸ Consomé de jaiba\n• 3 dedos de pulpa de jaiba\n• Caldo de camarón\n\n▸ Consomé campechano\n• 4 almejas\n• 3 dedos de pulpa de jaiba\n• Caldo de camarón","pro":"▸ Consomé de almeja\nSe calienta el caldo con la almeja y cuando este hirviendo se sirve.\n\n▸ Consomé de jaiba\nSe calienta el caldo y cuando este hirviendo se sirve en la cazuela de barro con la pulpa de jaiba.\n\n▸ Consomé campechano\nSe calienta el caldo con la almeja y cuando este hirviendo se sirve en la cazuela de barro y se agraga la pulpa de jaiba."},"Sopas":{"ing":"▸ Sopa de mariscos\n• 1 pz de pescado.\n• 3 almejas\n• 4 pz de camarón para caldo.\n• 3 dedos de pulpo.\n• 3 dedos de pacotilla.\n• 3 dedos de surimi.\n• 3 dedos de caracol.\n• 3 dedos de calamar blanco\n• 1 jaiba entera.\n• 1 cuchara de ostión.\n\n▸ Sopa de tortilla\n• 60 gr pacotilla\n• 60 gr pulpo\n• 60 gr sirimi\n• una mano aguacate\n• seis dedos de queso Oaxaca\n• 3 tortillas doradas en rajas\n• un poco de crema","pro":"▸ Sopa de mariscos\nSe agraga todo hasta que coza el pes y la jaiba.\n\n▸ Sopa de tortilla\nSe pone el caldo a calentar con los mariscos, cuando este hirviendo se sirve en la cazuela, se pone el queso y luego se colocan las torillas doradas, la crema y el aguacate y se sirve."},"Mojarra":{"ing":"▸ Mojarra rellena\n• 1 mojarra ch.\n• 1 copa chica de pulpo, camarón y surimi.\n• pico de gallo\n• combinado\n• agua bendita\n• mantequilla\n• sal\n• jitomate\n• chile\n• epazote\n• cebolla\n\n▸ Mojarra sarandeada\n• 1 mojarra grande marinada\n• aceite de oliva\n• cebolla morada\n• soya.","pro":"▸ Mojarra rellena\nSe corta papel aluminio y se pone mantequilla embarrada, luego se pone rodajas jitomate, cebolla, epazote y rajas; luego se coloca la mojarra ya marinada, el marisco se prepara con pico, agua bendita y combinado, y se envuelve y se pone otra cama de jitomate, cebolla, epazote y rajas y se le pone agua bendita y combinado, después se cubre y se sella con al papel aluminio, en la plancha se coloca por 15 minutos de un kado y 15 del otro.\n\n▸ Mojarra sarandeada\n—"},"Camarones":{"ing":"▸ Camarones aguachile\n• copa gr. de pacotilla.\n\n▸ Camarones a la plancha\n• 1 porcion de camarón de orden.\n• combinado\n• agua bendita\n• pepino\n• lechuga\n• 1 limón\n\n▸ Camarones rancheros\n• 1 porcion de camaron de orden.\n• pico de gallo\n• chile cuarismeño en rodajas\n• cebolla fileteada.\n• 1 mano de aguacate\n• arroz 1 porción.\n\n▸ Camarones al tequila\n• 1 porcion de camarones de orden.\n• pico de gallo\n• crema\n• combinado\n• agua bendita\n• 1 cacahuatero de tequila\n• chile morron.\n\n▸ Camarones cucaracha\n—\n\n▸ Brochetas de camarón\n• 1 porcion de camaroenes empanizados.\n• Rodajas de platano\n• Rodajas de cebolla morada\n• Rodajas de jitomate.\n• Apio\n• Chile morron.\n\n▸ Camarones reina\n• 1 orde de camarones\n• Queso\n• Tocineta\n• Combinado\n• Agua bendita\n• Arroz\n\n▸ Camarones reyna\n• 1 porcion de camarones de orden.\n• 6-7 tiras de tocineta\n• queso Oaxaca\n• arroz\n\n▸ Camarones hawaiana\n• copa ch pacotilla\n• 2 tiras de tocineta\n• 1 rodaja de piña\n• cilantro\n• salsa durazno\n• arroz una orden\n• una orden de ensalada","pro":"▸ Camarones aguachile\n—\n\n▸ Camarones a la plancha\nSe colocan los camarones en la plancha que queden bien dorados, con poca agua bendita y combinado, se le agrega el jugo de limón y se sirve en la cama de lechuga y pepino.\n\n▸ Camarones rancheros\nEn el sarten se coloca aceite y la cebolla, se pone el camaron se saltea con combinado y agua bendita, se agrega el chile y el pico de gallo, se sirve con la mano de aguacate y el arroz.\n\n▸ Camarones al tequila\n—\n\n▸ Camarones cucaracha\nLo de siempre pero con salsa huichol.\n\n▸ Brochetas de camarón\nSe colocan los ingredientes en palillos y se ponen en el aceite a freir.\n\n▸ Camarones reina\nSe rellena el camarón con queso, se envuelve en la tocinet, se pone en la plancha con el combinado y el agua bendita y se tapa.\n\n▸ Camarones reyna\nSe coloca queso Oaxaca en los camarones, se envuelven en tocino y se ajusta con palillos, se coloca en el sarten aceite, después los camarones y se le agrega combinado y agua bendita, se sirven sin palillos en una cama de arroz de forma de círculo\n\n▸ Camarones hawaiana\nSe pone la tocineta en cuadros en el sarten que se dore con el aceite, después se pone el camarón se saltea con combinado y agua bendita, se pone, la piña cortada en cuadritod, el cilantro y se sirve al final se le pone salsa durazno."},"Pulpo":{"ing":"▸ Pulpo enamorado\n• 1 copa gr de pulpo.\n• combinado\n• agua bendita\n• crema\n• mayonesa\n• chipotle.\n• arroz.\n\n▸ Cocción del pulpo\n—","pro":"▸ Pulpo enamorado\nSe saltea el pulpo con los sazonadores\n\n▸ Cocción del pulpo\nEl pulpo se coce de la siguiente manera: se limpia el pulpo cuando llega de la central, si está congelado se pone en un bote con agua para descongelarlo, si esta crudo se limpia directamente.\nEn la olla se coloca agua con un fajo de hierbas de olor, una raja de canela, 6 ajos y una cebolla partida; ya que el agua esta hirviendo, se pone el pulpo no importa los kilos que sean y se pone también una cuchara de sal de las grandes que se usan para mover el caldo."},"Paella":{"ing":"• 5 tiras de tocino\n• 3/4 de cabeza de lomo\n• 3/4 de muslo picado\n• 1 paquete chico de salchica\n• 2 jaibas\n• 4-5 tiras de pescado\n• 20 almejas crudas\n• 1 kilo de arroz precocido\n• 2 chiles morron\n• 6 dientes de ajo\n• 1 cebolla\n• 3 puntitas de cichara sopera de amarillo huevo\n• 1 ½ cucharadas soperas de sal\n• ½ cucharada sopera de nor suiza.\n• 2 litros de agua","pro":"En una cacerola de 2 kilos se coloca aceite, despues el tocino, despues la cabeza de lomo que se sofria bien y se le pone un poco de sal, después el pollo que se sofria bien com un poco de sal, después la salchicha que se sofria, después la jaiba con almejas que se sofria se le pone un poco se sal, al último el pescado cortado en trozos con el arroz precocido se le pone un poco de sal, aparte se muele el ajo con la cebolla y se pone en la olla, se coloca el chile morron en rajas, y el amarillo huevo, se pone 2 litos de agua con la sal y el nor suiza y se mueve hasta que agarre el color deseado, y se deja cociendo por media hora con flama media y hay que estar cuidando de que sea ese el tiempo en caso de que tenga agua subir la flama y si es poca el agua, bajar la flama."},"Filete":{"ing":"▸ Filete relleno\n• 1 filete\n• 1 copa chica de pulpo, camarón y surimi.\n• combinado\n• agua bendita\n• mantequilla\n• sal\n• jitomate\n• chile\n• epazote\n• cebolla\n\n▸ Filete hawaiano\n• 1 Filete\n• 4 rodajas de piña\n• cilantro\n• pico de gallo\n• queso Oaxaca\n• jamón\n• arroz\n• salsa salsa de mango o durazno.","pro":"▸ Filete relleno\nSe corta papel aluminio y se pone mantequilla embarrada, luego se pone rodajas jitomate, cebolla, epazote y rajas; luego se coloca el filete con un poco de sal y el marisco y se envuelve y se pone otra cama de jitomate, cebolla, epazote y rajas y se le pone agua bendita y combinado, después se cubre y se sella con al papel aluminio. Se pone en la plancha por 5 minutos por lado.\n\n▸ Filete hawaiano\nSe coloca el papel aluminio con mantequilla y 2 rodajas de piña, se pone el filete al cual se le puso ya agua bendita y combinado, se coloca sobre el filete el jamon picado, con pico de gallo, cilantro y queso, se le pone otras 2 rodajas de piña y se sella con el papel aluminio, se pone en la plancha por espacio de 5 minutos por lado. Se sirve con arros y salsa se mango."},"Arroz":{"ing":"▸ Arroz (2 kg)\n• 2 kilos de arroz\n• 12-16 cucharadas soperas de aceite\n• 4 litros de agua\n• 4 chorros de aceite\n• 6 dientes de ajo\n• 1 cebolla mediana\n• 2 cucharadas de sal soperas\n• 2 cucharadas de norsuiza\n• 1 chorro de agua bendita\n\n▸ Arroz a la tumbada\n• 3 de rajas\n• 3 dedos de epazote\n• 3 cebolla\n• pacotilla (copa chica con los demás mariscos)\n• calamar\n• pulpo\n• caracol\n• 3 almejas\n• 3 camarones de caldo\n• 1 ½ de arroz\n\n▸ Arroz con mariscos\n• 5 camaron de caldo\n• copa chica de pacotilla, pulpo y surimi\n• 4 almejas\n• 1 jaiba entera\n• 2 ½ medidas de arroz","pro":"▸ Arroz (2 kg)\nPrimero se pone el arroz a remojat en agua caliente por uno o dos minutos y se revuelve, se enjuaga y se pone a escurrir, después en una cacerola de 2 kilos se pone el aceite y se sofrie el arroz hasta que quede arenoso, se calienta bien la olla antes de poner el arroz para que no se pegue, aparte se mueles los ajos con la cebolla con agua, la sal, el norsuisa y el agua bendita y se mueve para que agarre bien los ingredientes, ya sazonado se le ponen los 4 litros de agua, se mueve y se tapa a fuego medio a alto por 25 a 30 minutos, se cuida el agua si hay mucha se sube el fuego si hay poca se baja el fuego.\n\n▸ Arroz a la tumbada\nsaleamos con mantequilla las rajas cebolla y cilantro, esperamos que  suelte sabor, despues se le agrega los mariscos con combinado y agua bendita, se agrega el arroz y caldo de camarón.\n\n▸ Arroz con mariscos\n—"},"Especial de mariscos":{"ing":"▸ Queso fundido de mariscos\n• 3 dedos de pulpo\n• 3 dedos se camarón\n• queso Oaxaca\n• combinado\n• agua bendita\n\n▸ Omelet de mariscos\n• 3 huevos\n• pulpo\n• camaron\n• surimi\n• agua bendita\n• combinado\n• 1 cacahuatero de sazón\n• crema\n• sal\n\n▸ Encazuelada de mariscos\n• 1 pescadito\n• 1 cucharada de ostion\n• 1 copa gr de pacotilla, calamar, caracol, pulpo, surimi.\n• 4 almejas\n• 4 camarones para caldo\n• 3 dedos de epazote\n• 3 dedos de cebolla\n• 3 dedos de rajas\n• queso suficiente\n\n▸ Ensalada de mariscos\n—\n\n▸ Spaghetti a la marinera\n• 1 copa ch de mariscos\n• 1 bosa de espaguetis\n• 1 medida de sazon","pro":"▸ Queso fundido de mariscos\nSe pone en un sarten y despues se pasa a la cazuela chica, se pone a calentar bien hasta que se derrita todo el queso, se sirve con tortilla de harina.\n\n▸ Omelet de mariscos\nSe hace una tortilla para el huevo, se cocina todo lo demás aparte y después se le agrega a la tortilla de huevo, se dobla y se le pone el sazón.\n\n▸ Encazuelada de mariscos\nSe pone en la cazuela el pescadito, con ostion y aceite, después se agrega el maricos con agua bendita y combinado, se le pone cebolla, rajas, epazote y el queso.\n\n▸ Ensalada de mariscos\nSe pone una cama de pepino, encima jitomate, (la receta en el Excel está incompleta).\n\n▸ Spaghetti a la marinera\nen un sarte se pone mantequilla, se agrega aceite y mariscos con le de siempre, se agrega el espagueti y luego otro poco de mantequilla y se saltea y después se pone el sazon y un poco de crema y se sirve.\npara preparar la pasta\n1 paquete de spaghetti\nse pone agua a calentar y se le pone la sal, la cebolla y un chorro de agua bendita. Cuando ya este hirviendo se pine el espagueti y se saca cuando ya este suave, al final se cuela y se le pone in poco de aceite de oliva y se guada en tres bolsitas."},"Jaibas":{"ing":"▸ Jaibas al mojo\n• 3 jaibas enteras\n• combinado\n• agua bendita\n• lechuga\n• pepino\n• jitomate\n• jícama\n\n▸ Jaibas rellenas\n• 1 copa chica de pulpa de jaiba\n• poco de gallo y cilantro\n• 4 cascarones de jaiba.","pro":"▸ Jaibas al mojo\n—\n\n▸ Jaibas rellenas\nSe saltea la jaiba con el pico y el cilantro con agua bendita y combinado, se coloca en el cascaron se pone huevo y oan molido y se coloca en el aceite.\nSe monta en una base de lechuga y pepino y se sirve."},"Chiles":{"ing":"▸ Chiles rellenos de tres\n• 3 chiles cuarismeños preparados.\n• queso Oaxaca.\n• pacotilla 3 dedos.\n• 1/2 atún\n• pico de gallo\n• cilantro.\n\n▸ Chile en nogada\n• 1 chilenpoblano\n• 1 porcion de carne molida.\n• 1 cacahuatero de nuez y almendra\n• aparte 1 cucharada ch de nuez picada.\n• ½ crema de cacahuatero\n• ½ lechera de un cacahuatero\n• fruta seca lo que se necesite 3 dedos).\n• 3 dedos de cebolla picada.\n\n▸ Chile poblano relleno\n• 1 chile poblano\n• tres dedos camaron ( copa ch de mariscos)\n• tres dedos pulpo\n• tres dedos surimi\n• combinado\n• agua bendita\n• 1 cacahuatero de sazón\n• queso Oaxaca\n• cama de arroz\n• 1 camaron de caldo\n\n▸ Chile poblano (otra versión)\n• 1 chile poblano\n• camaron\n• pulpo\n• surimi\n• combinado\n• agua bendita\n• 1 cacahuatero de sazón\n• queso Oaxaca\n• cama de arroz\n• 1 camaron de caldo","pro":"▸ Chiles rellenos de tres\nLos chiles se rellenan, uno de queso, otro de camaron\n(el camarón se revuelve con pico de gallo y cilantro, con bruja y aceite de olivo), otro de atún (igual se mezcla comonse hizo con el camarón), se calientan en el microondas como una paella y se sirven en una cama de arroz.\n\n▸ Chile en nogada\nSe descongela la carne en el microondas, y se saltea en el sarten con acelte, la cebolla, agua bendita, y combinado, se la cuchara de semilla, se agrega la fruta seca. Después se rellena el chile se caliente en el microondas o en el sarte, se sirve en una cama de arroz y encima se coloca la salsa, se adorna en su caso con granada o con jitomate y cilantro.\nNota: la salsa de nogada se prepara con la lechera, la crema y el cacahuatero de nuez y almendra y se coloca en la licuadora, debe qiedar espesa para servirse.\n\n▸ Chile poblano relleno\nSe frie todo, se rellena el chile, se agraga el queso encima y se calienta en el microondas por 1 minuto y se coloca el camaron frito en aceite encima.\n\n▸ Chile poblano (otra versión)\nSe frie todo, se rellena el chile, se agraga el queso encima y se calienta en el microondas por 1 minuto y se coloca el camaron encima."},"Sincronizadas":{"ing":"• copa ch de pacotilla\n• un poco de pico se gallo\n• un poco de cilantro\n• 3 tortillas de harina\n• queso Oaxaca\n• rebanadas de aguacate\n• un poco se salsa chipotle\n• para las hawaianas se agrega además piña, jamon y queso y se coloca un poco menos de pacotilla.","pro":"Se saltea el camarón, se le agrega el pico de gallo con el cilantro, las tortillas se calientan para que esten suaves y se agrega el camaron y se le pone queso Oaxaca, se le pone un poco de acite y chile chipotle, se cuida y cuando este derretido el queso se sirve con las rebanadas de aguacate."},"Agua fresca":{"ing":"• 1 litro de arroz remojado\n• 333 ml de leche clavel\n• 4 cucharadas grandes de azúcar\n• 1 cuchara sopera de vainilla\n• 1 tapita de canela\n• 1 raja de canela","pro":"Un dia antes se pone el arroz a remojar con la canela, después se muele el arroz por espacio de 5 minutos hasta que quede bien molida el arroz y la canela, después se mezclan los demás ingredientes."},"Café":{"ing":"• 2 piloncillos chicos\n• trozo de canela\n• 1 cucharada de café","pro":"—"},"Plátanos fritos":{"ing":"• 6 tiras de platano macho.","pro":"Se colocan en el aciete y se sirven con crema y lechera."},"Postres":{"ing":"• 4 huevos\n• 1 taza de lechera\n• 1/2 taza de nutrileche\n• 1/2 taza de clavel\n• 2 tapitas de vainilla","pro":"Se colocan los ingredientes en la licuadora, aparte en la flanera se derrite la azucar con caramelo para flan y se deja que enduresca el caramelo, después se vierte lo licuado y se coloca en la olla expréss a baño maria, cuando empieza a sonar la olla se deja en la lumbre por media hora a flama media, después se deja enfriar y por ultimo se guarda en el refrigerador."},"※ Pico de gallo":{"ing":"• jitomate\n• cebolla\n• ½ limon","pro":"Se pica el jitomate y la cebolla, se agrega agua bendita, combinado y sal al gusto."},"※ Marlin preparado":{"ing":"▸ Marlin (versión A)\n• 750g de marlin ahumado\n• 5 jitomates picados en cuadritos\n• 1/2 cebolla blanca picada\n• 2 cdas de chipotle o más si quieres.\n• 3 ajos finamente picados.\n• 2 hojitas de laurel.\n• 1 cdita de orégano.\n• 1 cda de vinagre blanco.\n• 1 puño de cilantro.\n• Jugo de medio limón sin semillas.\n• 4 chiles de árbol secos enteros.\n• Sal y pimienta.\n\n▸ Marlin (versión B)\n• 750g de marlin ahumado\n• 5 jitomates picados en cuadritos\n• 1/2 cebolla blanca picada\n• 2 cdas de chipotle o más si quieres.\n• 4 ajos finamente picados.\n• 4 hojitas de laurel.\n• 1 cdita de orégano.\n• 1 cda de vinagre blanco.\n• 1 puño de cilantro.\n• Jugo de medio limón sin semillas.\n• 4 chiles de árbol enteros.\n• Sal y pimienta.","pro":"▸ Marlin (versión A)\n1. Acitrona la cebolla en un sartén y cuando cambie de color, agrega el jitomate y las hojitas de laurel.\n2. Desmenuza el marlin ahumado con las manos o un cuchillo.\n3. Agrega el marlin al sartén junto con el ajo picado, orégano, sal, chipotle, vinagre y pimienta. Mezcla todo y sazona. Puedes agregar medio limón exprimido (opcional).\n4. Agrega los chiles de árbol enteros y cocina todo a fuego bajo unos minutos para que agarre sabor.\n5. Agrega el cilantro y revuelve.\n\n▸ Marlin (versión B)\n1. Acitrona la cebolla en un sartén y cuando cambie de color, agrega el jitomate y las hojitas de laurel.\n2. Desmenuza el marlin ahumado con las manos o un cuchillo.\n3. Agrega el marlin al sartén junto con el ajo picado, orégano, sal, chipotle, vinagre y pimienta. Mezcla todo y sazona. Puedes agregar medio limón exprimido (opcional).\n4. Agrega los chiles de árbol enteros y cocina todo a fuego bajo unos minutos para que agarre sabor.\n5. Agrega el cilantro y revuelve."},"※ Raspa de pescado":{"ing":"• ½ Kg. de Jitomate.\n• 50 gr. de una cebolla.\n• 50 gr. de guajillo.\n• 30 gr. de ajo.\n• 100 gr. de cebolla picada.\n• 30 ml. de aceite.\n• 4 cucharadas soperas de combinado.\n• 4 Cucharadas soperas de agua bendita\n• 4 Cucharadas soperas de vino blanco.\n• 2 Cucharadas soperas de sal.\n• 7 hojas de laurel.\n• 2 kg. de carne de pescado molida (raspa).","pro":"1. Azar, licuar y colar.\nEn un comal azar el jitomate, la cebolla, el guajillo y el ajo sin llegar a quemarse después licuarlos con poca agua y colar.\n2. Cocer Raspa.\nEn otra cacerola agregar el aceite con la cebolla picada para freírla un poco, después introducir la raspa hasta que esta se cosa.\n3. Mezclar.\nMezclar el 1 con el 2 mas el combinado, el agua bendita, el vino blanco, la sal, el laurel a fuego medio hasta que hierva y se consuma el caldo."},"※ Harina preparada (pescaditos)":{"ing":"• 10 kilos de harina de trigo.\n• 20 cucharadas soperas de royal\n• 10 cucharadas soperas de bicarbonato\n• 10 cucharadas soperas de sal\n• 10 cucharadas soperas de puntita de curri (15 gr).\n• 10 kg de harina.","pro":"Se ponen la harina en la cacerola, después el royal, la sal, el curri y se revuelve con la mano por 20 minutos hasta agarre color gris. Se enbolsa en las bolsas de harina."},"※ Sazón del caldo":{"ing":"• 11 Kg de jitomate.\n• 5.5 Kg de cebolla.\n• 0.250 Kg de poro.\n• 0.350 Kg de apio.\n• 0.600 Kg de ajo pelado.\n• 0.100 Kg de ch. Guajillo.\n• 3 Kg de puré de tomate.\n• 250 ml. De aceite limpio.","pro":"Cortar en trozos la cebolla, el poro, el apio y el jitomate para que tengan el mejor cocimiento posible. Desvenar completamente el chile guajillo.\n1) En una cacerola del tamaño adecuado verter el aceite para freír el ajo hasta que este cambie a color café(no color negro).\n2) Agregar el chile guajillo para cocer hasta que este cambie de color.\n3) Agregar la cebolla para cocer hasta que esta cambie de color.\n4) Agregar el poro y apio para cocer hasta que estos cambien de color.\n5) Agregar el jitomate, dejar que este se cosa hasta que cambie de color.\n6) Dejar que todo el sofrito se enfríe para después vaciarle el puree de tomate mezclarlo lo mas que se pueda y licuarlo por partes para no dañar la licuadora.\n7) Ya licuado se pone por ultimo a sofreír otra vez, se coloca en botes y se guarda."},"※ Caldo base":{"ing":"• 1 kilo de retazo de pez.\n• 250 gr. de epazote.\n• 250 gr. de camaron seco( cabeza)\n• 2 cucharadas soperas de sal.\n• 2 cucharadas soperas de salsa diabla.\n• 1 cucharada de sazonador de camaron en polvo.\n• 3 1/2 litros de sazón.","pro":"Se pone el agua en la olla con el retazo y el epazote a calentar, hasta que hierva, después en la licuadora se coloca los 250 gr. de camaron seco con agua y se muele, se agraga a la olla el sazon con la sal, el polvo de camarón y la salsa diabla y se deja hervir un rato, al final se prueba para ver como esta para ver si quedo o le falta algo."},"※ Aguachile (base)":{"ing":"• Copa grande de pacotilla\n• Chile habanero\n• Jugo de limon\n• Cebolla morada\n• combinado\n• Aceite de oliva\n• Bruja\n• Pepino","pro":"Se abre el camaron pacotilla, se coloca en el jugo de limón, con los demás ingredientes y se deja ahí por espacio de 10 minutos, después se sirve en plato trinche primero el pepino y después el camarón con chile habanero."},"※ Salsa capsu":{"ing":"• 1/2 bote de capsu (19 lt.)\n• 1 litro de Miranda.\n• 6 piloncillos chicos.\n• 1/3 de canela.\n• 2 1/2 lt. de agua.","pro":"Se pone el piloncillo a calentar con la canela hasta que se derrite en la cacerola con agua hasta el borde, se saca el gas al refresco y se revuelve con la capsu, el agua y el refresco y el agua del pilocillo derretido, se cuela antes. Se guarda."},"※ Salsa diabla":{"ing":"• 250 gr. de chile morita\n• 250 gr. de mora.\n• 50 gr. de chile ancho\n• 125 gr. de guajillo.\n• 125 gr. de pulla.\n• 750 gr. cebolla en trozos.\n• 100 gr. ajo.\n• clavo 1/2 cuchara sopera.\n• pimienta 1/2 cichara sopera.\n• 50 gr. de canela.\n• 2 cucharas soperas de sal.\n• 2 puños de ajo dorado.\n• 3 ramas de laurel.","pro":"El chile se tuesta en una cazuela, en dos tandas con la cebolla y el ajo, se licua con la canela, el clavo y la pimienta y agua hasta cubrir los chiles, ya licuado se pone a calentar con tantito aceite, se pone la sal y el ajo dorado con las tres ramas de laurel. Se deja hervir por 30 minutos."},"※ Salsa Veracruz":{"ing":"• 1 Morron\n• 1 cebolla\n• 2 zanahorias\n• 12 aceitunas picada.\n• una bolsita 100 gr. chile güeros\n• vino blanco 1 cacahuatero","pro":"Se prepara colocando en un sartén con aceite, el morron en tiras, la cebolla en rodajas, la zanahoria en rodajas, el vino, la aceituna picada, se sofríen y al final se ponen los chiles güeros."},"※ Salsa de mango":{"ing":"• 1 lata de mango.\n• 2 cucharadas de mantequilla.\n• 2 C. Sopera de endulzante natural.\n• 1 C. Sopera de loltum","pro":"1. Licuar el mango, el endulzante y la loltum.\n2. Freírlo junto con la mantequilla\n3. Dejarlo hervir por 20 minutos a flama baja."},"※ Salsa de tamarindo":{"ing":"• 1 kilo de tamarindo\n• 2 tazas de azúcar\n• 1 cucharada de salsa de pozole.\n• ½ cucharada sopera de sal.","pro":"1. Hervir muy bien el tamarindo\n2. Colarlo y dejar reposar una hora\n3. Freír el tamarindo con mantequilla\n4. Agregar azúcar\n5. Añadir un poco de chile de pozole\n6. Hervirlo\n7. Cuando este frio se guarda\nNota: se debe hervir cada 8 días"},"※ Salsa de vino tinto":{"ing":"• 2 tazas de leche\n• 1 taza de vino tinto\n• De 1 a 2 cucharadas de harina virgen\n• Medio trozo de mantequilla","pro":"1. Freír la mantequilla.\n2. Verter la leche.‘\n3. Agregar la harina.\n4. Añadir el vino.\n5. Colar toda la mezcla evitando los grumos.\n6. Hacer bolsas de 80g"},"※ Salsa de espinaca":{"ing":"• ½ kilo de espinaca\n• 300 gr de crema\n• 3 tiras de tocino\n• ¼ de cebolla picada\n• 30 gr de mantequilla","pro":"1. Picar la espinaca finamente\n2. Calentar el aceite\n3. Añadir el tocino y la cebolla; freírlos\n4. Verter la espinaca y freírlo bien\n5. Agregar la crema dejando una consistencia espes"},"※ Salsa BBQ":{"ing":"• El jugo de 3 limones.\n• Un chorro de combinado.\n• El jugo de una naranja.\n• ¼ de cucharada sopera de chipotle.\n• ¼ de cucharada sopera de cátsup coctelera.\n• Salsa BBQ.","pro":"1. A fuego medio en un sartén se verte la salsa BBQ, el jugo de los limones, la naranja, el\ncombinado, el chipotle y la catsup coctelera. Se mezclan bien los ingredientes, se deja que la\nmezcla hierva, para despues vaciarla sobre los camarones .\nNota: La salsa se debe hacer al momento"},"※ Salsa guajillo":{"ing":"• 6 jitomates\n• 3 ajos\n• un poco de cebolla\n• 15 chiles guajillo.","pro":"Tatemar en la placha y despues moler en la licuadora."},"※ Salsa casera":{"ing":"• 7 jitomates duros picados\n• 1 cebolla picada\n• 5 hojas de hierbas de olor\n• ½ taza de vino blanco.","pro":"1. Freír el jitomate\n2. Añadir la cebolla; freírla\n3. Agregar el vino blanco y las hierbas\n4. Dejar hervir por bastante tiempo"},"※ Ajo dorado":{"ing":"• 3 kilos de ajo picado\n• 4-5 cucharadas de sal\n• 1 taza de aceite de olivo\n• 5 hiervas de olor","pro":"1. Picar los ajos y en la tina correspondiente, agregarle; sal, aceite de olivo y hiervas de olor por aproximadamente 4 o 5 horas.\n2. En el siguiente proceso se pone aceite a calentar en el cazo, debe estar muy caliente, entonces se va hechando el ajo y se debe mover constantemente para que no se queme ni se pegue."},"※ Tinta de pulpo":{"ing":"• 1k de retazo de pescado.\ function conf(){const t=CFG.tema||"auto";return `<div class="tk"><b>Configuración</b><p class="mut">Apariencia de la pantalla (se guarda en este equipo).</p><div class="chips">${[["auto","🌓 Automático"],["light","☀️ Modo día"],["dark","🌙 Modo noche"]].map(([k,n])=>`<button class="chip ${t==k?"on":""}" onclick="setTema('${k}')">${n}</button>`).join("")}</div></div>${S.u&&S.u.rol=="admin"?`<div class="tk nx"><b>Gastos fijos mensuales</b><p class="mut">Se reparten por día en el reporte de utilidad.</p>${FIJOS.map((f,i)=>`<div class="row" style="align-items:center"><input class="num" style="width:45%;margin:0" value="${f[0].replace(/"/g,"&quot;")}" onchange="fijoSet(${i},0,this.value)"><span>$ <input class="num" style="width:90px;margin:0" type="number" inputmode="decimal" value="${f[1]}" onchange="fijoSet(${i},1,this.value)"> <button class="chip" onclick="fijoDel(${i})">✕</button></span></div>`).join("")}<input class="num" style="width:100%" placeholder="Nuevo gasto fijo (ej. Renta)" value="${S.nf||""}" oninput="S.nf=this.value"><input class="num" style="width:100%" type="number" inputmode="decimal" placeholder="Monto mensual $" value="${S.nfm||""}" oninput="S.nfm=this.value"><button class="cta" onclick="fijoAdd()">Agregar gasto fijo</button></div>`:""}`}
function setTema(k){CFG.tema=k;svc();aplicaTema();draw()}
function aplicaTema(){const t=CFG.tema,r=document.documentElement;if(t=="dark"||t=="light")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");const b=document.querySelector("#th");if(b)b.textContent=t=="dark"?"🌙":t=="light"?"☀️":"🌓"}
function tema(){CFG.tema=CFG.tema=="dark"?"light":CFG.tema=="light"?"auto":"dark";svc();aplicaTema()}
aplicaTema();
const fixU=()=>{if(S.u&&S.us[S.u.id])S.u=S.us[S.u.id];if(S.u&&Object.keys(S.us).length&&!Object.values(S.us).some(u=>u.rol=="admin")){S.u={...S.u,rol:"admin"};saveU(S.u)}};
function draw(){fixU();const y=scrollY,so=document.querySelector(".sheet>div"),st=so?so.scrollTop:0;$("#app").innerHTML=view()+sheet();
 document.querySelector("nav").style.display=S.u?"flex":"none";document.querySelectorAll("nav button").forEach(b=>b.hidden=!can(b.dataset.v));$("#sal").hidden=!S.u;if(S.u)$("#sal").textContent="🔒 "+S.u.nombre+" ("+S.u.rol+") · salir";const n=S.lin.filter(l=>!l.done&&!l.bar).length;$("#nk").hidden=!n;$("#nk").textContent=n;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==(S.v=="cobro"?"mesero":S.v)));const hl=$("#hl");if(S.logo){hl.src=S.logo;hl.style.display="inline"}else hl.style.display="none";scrollTo(0,y);const n2=document.querySelector(".sheet>div");if(n2)n2.scrollTop=st;guarda()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.v=b.dataset.v;draw()});
setInterval(()=>{$("#reloj").textContent=(S.on?"● en línea · ":"○ solo este equipo · ")+new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZone:"America/Mexico_City"});if(S.u&&!S.az&&(S.v=="cocina"||S.v=="mesas")&&!S.sh&&!typing())draw()},1000);
draw();
const FOC='input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden]):not([type=date]):not([disabled]),textarea',
campos=()=>[...document.querySelectorAll("#app "+FOC)].filter(x=>x.offsetParent!==null);
function hintEnter(){const L=campos();L.forEach((e,i)=>{if(e.tagName=="INPUT")e.setAttribute("enterkeyhint",i<L.length-1?"next":"done")})}
let HOLD=0,HOLD2=0,PEND=0;
document.addEventListener("keydown",e=>{if(!(e.key=="Enter"||e.keyCode==13)||e.shiftKey)return;const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||t.tagName=="TEXTAREA")return;const i=campos().indexOf(t);if(i<0)return;e.preventDefault();const n=campos()[i+1];if(n){HOLD=1;try{n.focus();try{n.select()}catch(_){}}finally{HOLD=0}}else t.blur()});
document.addEventListener("change",e=>{const t=e.target;if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||/checkbox|radio|file|date/.test(t.type))return;HOLD2=1;setTimeout(()=>{HOLD2=0;if(PEND&&!typing()){PEND=0;draw()}},150)},true);
document.addEventListener("focusout",()=>setTimeout(()=>{if(PEND&&!typing()){PEND=0;draw()}},80));
{const _d=draw;draw=function(){if(HOLD||HOLD2){PEND=1;return}_d();hintEnter()}}
hintEnter();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
